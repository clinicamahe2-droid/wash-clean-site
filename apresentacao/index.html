<script>
const wrap=document.querySelector('.wrap');
const secs=[...document.getElementById('t').content.querySelectorAll('section')];
const slots=secs.map(s=>{const d=document.createElement('div');d.className='slot';d.appendChild(s);wrap.appendChild(d);return d});
function fit(){slots.forEach(d=>{d.firstChild.style.transform='scale('+(d.clientWidth/1920)+')'})}
fit();addEventListener('resize',fit);
const n=document.getElementById('n');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)n.textContent=(slots.indexOf(e.target)+1)+' / '+slots.length}),{threshold:.55});
slots.forEach(s=>io.observe(s));
addEventListener('keydown',e=>{const i=slots.findIndex(s=>s.getBoundingClientRect().top>-10);const k=e.key;
 if(k==='ArrowDown'||k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();(slots[Math.min(i+1,slots.length-1)]||slots[0]).scrollIntoView({behavior:'smooth',block:'center'})}
 if(k==='ArrowUp'||k==='ArrowLeft'||k==='PageUp'){e.preventDefault();(slots[Math.max(i-1,0)]).scrollIntoView({behavior:'smooth',block:'center'})}});
</script>
